  <text x="56" y="102" font-size="34" font-weight="800" letter-spacing="1" fill="url(#accent)" filter="url(#soft)">WHAT YOU'LL FIND HERE</text>
  <rect x="56" y="120" width="220" height="2.5" rx="1.25" fill="url(#hairline)"/>
</g>
