  <text x="552" y="320" font-size="12" font-weight="700" fill="#36bcf7" text-anchor="end" class="mono">IN PROGRESS · 55%</text>
  <rect x="72" y="330" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
