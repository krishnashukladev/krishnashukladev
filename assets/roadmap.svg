  <text x="552" y="472" font-size="12" font-weight="700" fill="#e3b341" text-anchor="end" class="mono">LEARNING · 30%</text>
  <rect x="72" y="482" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
