  <text x="1120" y="168" font-size="12" font-weight="700" fill="#36bcf7" text-anchor="end" class="mono">IN PROGRESS · 55%</text>
  <rect x="640" y="178" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
  <rect x="640" y="178" width="264" height="10" rx="5" fill="#36bcf7" class="grow" style="animation-delay:0.45s"/>
  <circle cx="904" cy="183" r="4" fill="#36bcf7" class="pulse"/>
</g>
<g class="enter" style="animation-delay:0.37s">
