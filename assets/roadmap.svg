  <text x="72" y="168" font-size="15.5" font-weight="600" fill="#dce6f5">Git &amp; GitHub workflows</text>
  <text x="552" y="168" font-size="12" font-weight="700" fill="#39d353" text-anchor="end" class="mono">DONE · 100%</text>
  <rect x="72" y="178" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
  <rect x="72" y="178" width="480" height="10" rx="5" fill="#39d353" class="grow" style="animation-delay:0.35s"/>
  <circle cx="552" cy="183" r="4" fill="#39d353" class="pulse"/>
</g>
