  <text x="552" y="396" font-size="12" font-weight="700" fill="#e3b341" text-anchor="end" class="mono">LEARNING · 25%</text>
  <rect x="72" y="406" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
  <rect x="72" y="406" width="120" height="10" rx="5" fill="#e3b341" class="grow" style="animation-delay:0.71s"/>
  <circle cx="192" cy="411" r="4" fill="#e3b341" class="pulse"/>
</g>
<g class="enter" style="animation-delay:0.63s">
