  <text x="72" y="244" font-size="15.5" font-weight="600" fill="#dce6f5">Linux administration</text>
  <text x="552" y="244" font-size="12" font-weight="700" fill="#36bcf7" text-anchor="end" class="mono">IN PROGRESS · 65%</text>
  <rect x="72" y="254" width="480" height="10" rx="5" fill="#ffffff" fill-opacity=".05" stroke="#2b3b55" stroke-opacity=".6"/>
  <rect x="72" y="254" width="312" height="10" rx="5" fill="#36bcf7" class="grow" style="animation-delay:0.47000000000000003s"/>
  <circle cx="384" cy="259" r="4" fill="#36bcf7" class="pulse"/>
