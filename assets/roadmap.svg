  <circle cx="664" cy="487" r="4" fill="#8b98ad" class="pulse"/>
</g>
<g class="enter" style="animation-delay:.9s">
  <text x="72" y="556" font-size="13.5" fill="#7a8aa5" class="mono">$ progress over perfection — tools move into the stack only after real hands-on use<tspan class="blink" fill="#58e6ff">▊</tspan></text>
</g></svg>